name: Publish verified Plugin Bridge v0.9.14

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.9.14.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERSION: "0.9.14"
      ARTIFACT_SHA256: "6e6861feb6a7af8e997f1ed2866af19c4adbb4c0d35b63fc8011ca749a0b6c50"
      EXE_SHA256: "e36bb3d26a331a2cf4e2b19d6968ee1a7ddc9c64c05b665a00ac26f2022e831c"
      ARTIFACT_URL: "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-dde0-81fa-9cd2-8d6f93281d4f/raw?se=2026-09-14T16%3A43%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=96392a0d-0c12-5407-b1e9-397814a76181&skoid=0556a536-9b18-4aa8-bae0-70ed682ee936&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T02%3A56%3A54Z&ske=2026-09-15T02%3A56%3A54Z&sks=b&skv=2026-02-06&sig=oHOcoBTKHcd0CwznkluNIXYHb8PYIdyjQROLBoULaT4%3D"
    steps:
      - uses: actions/checkout@v4

      - name: Download previously verified v0.9.14 CI artifact
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'plugin-bridge-windows-ci.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $env:ARTIFACT_URL -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:ARTIFACT_SHA256) {
            throw "CI artifact digest mismatch: $actual"
          }
          $extract = Join-Path $env:RUNNER_TEMP 'verified-release'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $installer = Join-Path $extract "PluginBridge-$env:VERSION\PluginBridge-Setup-$env:VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Verified installer missing from artifact: $installer"
          }
          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($exeHash -ne $env:EXE_SHA256) {
            throw "Installer digest mismatch: $exeHash"
          }
          Copy-Item -LiteralPath $installer -Destination (Join-Path $PWD 'plugin-bridge.exe') -Force
          Remove-Item -LiteralPath (Join-Path $PWD 'codex-plugin-bridge.exe') -Force -ErrorAction SilentlyContinue
          [IO.File]::WriteAllText((Join-Path $PWD 'VERSION'), "$env:VERSION`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), "$exeHash  plugin-bridge.exe`n$exeHash  PluginBridge-Setup-$env:VERSION.exe`n", [Text.UTF8Encoding]::new($false))
          "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PUBLISHED_SHA256=$exeHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Commit standalone EXE and release metadata
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: Plugin Bridge v$env:VERSION standalone EXE"
          if ($LASTEXITCODE -ne 0) { throw 'Release commit failed.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Release push failed.' }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $notes = @"
          Plugin Bridge v$env:VERSION

          - Single-file Windows installer; Python and pip are not required on the destination PC.
          - Runtime assets required by Plugin Bridge are embedded in the EXE.
          - Installer uses the current Windows-safe self-install/upgrade path with stop/wait plus retry for transient WinError 5/32 replacement failures.
          - Verified source CI: 410 tests passed, Ruff passed, mypy passed, secret scan passed.
          - Verified release smokes: standalone EXE, self-install, upgrade from v0.9.10, port conflict, managed package, and release secret scan.

          SHA-256: $env:PUBLISHED_SHA256
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesFile, $notes.Trim(), [Text.UTF8Encoding]::new($false))
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:INSTALLER --clobber
          } else {
            gh release create $tag $env:INSTALLER --target main --title "Plugin Bridge v$env:VERSION" --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
          gh release view $tag --json tagName,url,assets
