name: Reusable rebrand to TranDangKhoaAutomation

on:
  workflow_call:

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Standardize personal branding and copyright
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          BRAND = "TranDangKhoaAutomation"
          HUMAN = "Trần Đăng Khoa"
          PAGES = "https://trandangkhoaautomation.github.io"

          def is_workflow(path: Path) -> bool:
              return path.as_posix().startswith(".github/workflows/")

          # Preserve operational endpoints whose replacement has not been verified.
          # This includes an old YouTube handle and the legacy .xyz API/domain.
          OPERATIONAL = re.compile(
              r"(?:https?://)?(?:www\.)?(?:youtube\.com/@(?:codewithkhoa|trandangkhoatechnology)|trandangkhoatechnology\.xyz)(?:[^\s\"'<>)]*)?",
              re.IGNORECASE,
          )

          def normalize_copyright(text: str) -> str:
              holder = rf"(?:{re.escape(HUMAN)}|Tran\s*Dang\s*Khoa|{BRAND})"
              prefix = r"(?P<prefix>(?:Copyright\s*)?(?:\(c\)|©)\s*(?:(?:19|20)\d{2}(?:\s*[-–—]\s*(?:(?:19|20)\d{2}|present))?\s*)?)"
              pattern = re.compile(prefix + holder + rf"(?:\s*/\s*{BRAND})?", re.IGNORECASE)
              return pattern.sub(lambda m: f"{m.group('prefix')}{HUMAN} / {BRAND}", text)

          def convert(text: str) -> str:
              kept = []
              def stash(match):
                  kept.append(match.group(0))
                  return f"__TDK_OPERATIONAL_{len(kept)-1}__"

              text = OPERATIONAL.sub(stash, text)

              text = re.sub(
                  r"(?i)https://github\.com/(?:CodeWithKhoa|TranDangKhoaTechnology)(?=/|\.png|$)",
                  f"https://github.com/{BRAND}",
                  text,
              )
              text = re.sub(
                  r"(?i)https://raw\.githubusercontent\.com/(?:CodeWithKhoa|TranDangKhoaTechnology)/",
                  f"https://raw.githubusercontent.com/{BRAND}/",
                  text,
              )
              text = re.sub(
                  r"(?i)https?://trandangkhoatechnology\.github\.io",
                  PAGES,
                  text,
              )

              variants = (
                  r"(?i)\bcode\s*with\s*khoa\b",
                  r"(?i)\btrandangkhoatechnology\b",
                  r"(?i)\btran\s+dang\s+khoa\s+technology\b",
                  r"(?i)\btrần\s+đăng\s+khoa\s+technology\b",
                  r"(?i)\btran\s+dang\s+khoa\s+automation\b",
                  r"(?i)\btrần\s+đăng\s+khoa\s+automation\b",
              )
              for pat in variants:
                  text = re.sub(pat, BRAND, text)

              text = normalize_copyright(text)

              for i, value in enumerate(kept):
                  text = text.replace(f"__TDK_OPERATIONAL_{i}__", value)
              return text

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          changed = []
          renames = []

          for name in tracked:
              if not name:
                  continue
              p = Path(name)
              if is_workflow(p) or not p.is_file():
                  continue
              try:
                  raw = p.read_bytes()
                  if b"\0" in raw:
                      continue
                  old = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              new = convert(old)
              if new != old:
                  p.write_text(new, encoding="utf-8", newline="")
                  changed.append(name)

          for name in sorted((x for x in tracked if x), key=lambda x: x.count("/"), reverse=True):
              p = Path(name)
              if is_workflow(p) or not p.exists():
                  continue
              new_name = re.sub(r"(?i)code\s*with\s*khoa|trandangkhoatechnology", BRAND, p.name)
              if new_name == p.name:
                  continue
              dest = p.with_name(new_name)
              if dest.exists():
                  continue
              try:
                  p.rename(dest)
                  renames.append(f"{p} -> {dest}")
              except OSError:
                  pass

          print(f"Changed text files: {len(changed)}")
          for item in changed:
              print(item)
          print(f"Renamed entries: {len(renames)}")
          for item in renames:
              print(item)

      - name: Verify legacy personal branding in tracked text
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          legacy = re.compile(r"code\s*with\s*khoa|trandangkhoatechnology|tran\s+dang\s+khoa\s+technology|trần\s+đăng\s+khoa\s+technology", re.I)
          operational = re.compile(
              r"(?:https?://)?(?:www\.)?(?:youtube\.com/@(?:codewithkhoa|trandangkhoatechnology)|trandangkhoatechnology\.xyz)(?:[^\s\"'<>)]*)?",
              re.I,
          )
          hits = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\0")
          for name in tracked:
              if not name or name.startswith(".github/workflows/"):
                  continue
              p = Path(name)
              if not p.is_file():
                  continue
              try:
                  raw = p.read_bytes()
                  if b"\0" in raw:
                      continue
                  text = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              scrubbed = operational.sub("", text)
              if legacy.search(scrubbed):
                  hits.append(name)
          if hits:
              print("Legacy branding remains in:")
              for name in hits:
                  print(name)
              raise SystemExit(1)
          print("Verified: no non-exempt legacy personal branding remains in tracked UTF-8 text.")

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then echo "No branding/copyright changes needed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize branding and copyright"
          git push
